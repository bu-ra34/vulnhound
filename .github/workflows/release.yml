name: Release

# Publishes to PyPI with Trusted Publishing (OIDC) — no API token stored.
# One-time setup on PyPI: add a "pending publisher" for project `vulnhound`,
# owner `bu-ra34`, repo `vulnhound`, workflow `release.yml`, environment `pypi`.
# Then publish a GitHub Release (or push a v* tag) to trigger this.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
